<!DOCTYPE html>
<html>
<head>
  <title>IPL Match Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    label {
      font-weight: bold;
    }
    select, input {
      width: 300px;
      padding: 6px;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
    #prediction-result {
      font-size: 20px;
      font-weight: bold;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>IPL Match Winner Predictor</h1>

  <form id="predict-form">
    <label for="team1">Team 1:</label><br>
    <select name="team1" required>
      <option value="Chennai Super Kings">Chennai Super Kings</option>
      <option value="Delhi Capitals">Delhi Capitals</option>
      <option value="Gujarat Titans">Gujarat Titans</option>
      <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
      <option value="Lucknow Super Giants">Lucknow Super Giants</option>
      <option value="Mumbai Indians">Mumbai Indians</option>
      <option value="Punjab Kings">Punjab Kings</option>
      <option value="Rajasthan Royals">Rajasthan Royals</option>
      <option value="Royal Challengers Bangalore">Royal Challengers Bangalore</option>
      <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
    </select><br>

    <label for="team2">Team 2:</label><br>
    <select name="team2" required>
      <option value="Chennai Super Kings">Chennai Super Kings</option>
      <option value="Delhi Capitals">Delhi Capitals</option>
      <option value="Gujarat Titans">Gujarat Titans</option>
      <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
      <option value="Lucknow Super Giants">Lucknow Super Giants</option>
      <option value="Mumbai Indians">Mumbai Indians</option>
      <option value="Punjab Kings">Punjab Kings</option>
      <option value="Rajasthan Royals">Rajasthan Royals</option>
      <option value="Royal Challengers Bangalore">Royal Challengers Bangalore</option>
      <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
    </select><br>

    <label for="venue">Venue:</label><br>
    <select name="venue" required>
      <option value="Arun Jaitley Stadium">Arun Jaitley Stadium</option>
      <option value="Barsapara Cricket Stadium">Barsapara Cricket Stadium</option>
      <option value="Brabourne Stadium">Brabourne Stadium</option>
      <option value="Dr DY Patil Sports Academy">Dr DY Patil Sports Academy</option>
      <option value="Eden Gardens">Eden Gardens</option>
      <option value="Green Park">Green Park</option>
      <option value="Holkar Cricket Stadium">Holkar Cricket Stadium</option>
      <option value="HPCA Stadium">HPCA Stadium</option>
      <option value="MA Chidambaram Stadium">MA Chidambaram Stadium</option>
      <option value="M Chinnaswamy Stadium">M Chinnaswamy Stadium</option>
      <option value="Narendra Modi Stadium">Narendra Modi Stadium</option>
      <option value="Rajiv Gandhi International Stadium">Rajiv Gandhi International Stadium</option>
      <option value="Sawai Mansingh Stadium">Sawai Mansingh Stadium</option>
      <option value="Wankhede Stadium">Wankhede Stadium</option>
      <option value="Ekana Cricket Stadium">Ekana Cricket Stadium</option>
      <option value="Punjab Cricket Association Stadium">Punjab Cricket Association Stadium</option>
    </select><br>

    <label for="city">City:</label><br>
    <select name="city" required>
      <option value="Ahmedabad">Ahmedabad</option>
      <option value="Bengaluru">Bengaluru</option>
      <option value="Chandigarh">Chandigarh</option>
      <option value="Chennai">Chennai</option>
      <option value="Delhi">Delhi</option>
      <option value="Dharamsala">Dharamsala</option>
      <option value="Guwahati">Guwahati</option>
      <option value="Hyderabad">Hyderabad</option>
      <option value="Indore">Indore</option>
      <option value="Jaipur">Jaipur</option>
      <option value="Kolkata">Kolkata</option>
      <option value="Lucknow">Lucknow</option>
      <option value="Mohali">Mohali</option>
      <option value="Mumbai">Mumbai</option>
      <option value="Nagpur">Nagpur</option>
      <option value="Pune">Pune</option>
      <option value="Raipur">Raipur</option>
      <option value="Rajkot">Rajkot</option>
      <option value="Ranchi">Ranchi</option>
      <option value="Visakhapatnam">Visakhapatnam</option>
    </select><br>

    <label for="toss_winner">Toss Winner:</label><br>
    <select name="toss_winner" required>
      <option value="Chennai Super Kings">Chennai Super Kings</option>
      <option value="Delhi Capitals">Delhi Capitals</option>
      <option value="Gujarat Titans">Gujarat Titans</option>
      <option value="Kolkata Knight Riders">Kolkata Knight Riders</option>
      <option value="Lucknow Super Giants">Lucknow Super Giants</option>
      <option value="Mumbai Indians">Mumbai Indians</option>
      <option value="Punjab Kings">Punjab Kings</option>
      <option value="Rajasthan Royals">Rajasthan Royals</option>
      <option value="Royal Challengers Bangalore">Royal Challengers Bangalore</option>
      <option value="Sunrisers Hyderabad">Sunrisers Hyderabad</option>
    </select><br>

    <label for="toss_decision">Toss Decision:</label><br>
    <select name="toss_decision" required>
      <option value="bat">Bat</option>
      <option value="field">Field</option>
    </select><br>

    <button type="submit">Predict</button>
  </form>

  <h2 id="prediction-result"></h2>

  <script>
    document.getElementById("predict-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const data = {};
      formData.forEach((value, key) => data[key] = value);

      fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(result => {
        document.getElementById("prediction-result").innerText = "🏆 Predicted Winner: " + result.predicted_winner;
      })
      .catch(error => {
        console.error("Error:", error);
        document.getElementById("prediction-result").innerText = "❌ Prediction failed. Check the console.";
      });
    });
  </script>
</body>
</html>
